<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunicah B.V. — Binnenkort online</title>
<meta name="description" content="Lunicah B.V. werkt aan een nieuwe website. Binnenkort online.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#081126">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse 120% 90% at 50% 0%, #122450 0%, #0a1531 45%, #050a19 100%) fixed;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .sky { position: fixed; inset: 0; pointer-events: none; }
  .sky i {
    position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 0 4px rgba(255,255,255,.6);
  }
  .sky i.tw { animation: tw 5s ease-in-out infinite; }
  @keyframes tw { 0%, 100% { opacity: var(--o); } 50% { opacity: .08; } }
  main {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 48px 24px;
  }
  h1 { line-height: 0; }
  .logo { width: min(420px, 78vw); height: auto; display: block; }
  .rule { width: 40px; height: 2px; background: #3e8bff; margin: 40px 0 24px; }
  .msg {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #c8d2e6;
  }
  .mail {
    margin-top: 18px;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    color: #ffffff;
    text-decoration: none;
    border-bottom: 1px solid rgba(62,139,255,.5);
    padding-bottom: 2px;
    transition: color .2s, border-color .2s;
  }
  .mail:hover, .mail:focus { color: #3e8bff; border-color: #3e8bff; }
  footer {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    padding: 28px 32px;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: #5d6a88;
  }
  footer address {
    font-style: normal;
    text-align: right;
    line-height: 1.6;
    color: #8592ad;
  }
  footer address strong { color: #c8d2e6; font-weight: 600; }
  @media (max-width: 560px) {
    footer { flex-direction: column-reverse; align-items: center; text-align: center; }
    footer address { text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) { .sky i.tw { animation: none; } }
</style>
</head>
