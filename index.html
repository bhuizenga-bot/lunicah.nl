<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunicah B.V. — Binnenkort online</title>
<meta name="description" content="Lunicah B.V. werkt aan een nieuwe website. Binnenkort online.">
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0e1220;
    color: #f2f3f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: grid;
    grid-template-rows: 1fr auto;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 48px 24px;
  }
  .logo {
    font-family: "Didot", "Bodoni 72", "Playfair Display", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(3.5rem, 11vw, 6.5rem);
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .logo span { color: #c9a96a; }
  .rule { width: 40px; height: 1px; background: #c9a96a; margin: 36px 0 28px; }
  .msg {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #b8bdcc;
  }
  footer {
    padding: 28px 24px;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: #6b7186;
  }
</style>
</head>
<body>
  <main>
    <h1 class="logo">Lunicah<span>.</span></h1>
    <div class="rule"></div>
    <p class="msg">Binnenkort online</p>
  </main>
  <footer>&copy; 2026 Lunicah B.V.</footer>
</body>
</html>
